spring.application.name=sportbet
server.port=${PORT:8081}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://sportbet-db.cloaswm6wg3j.eu-north-1.rds.amazonaws.com:5432/sportbet-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

API_FOOTBALL_KEY=${API_FOOTBALL_KEY:a1eac2c37dd30094c57db6431ab6abf2}